app = 'llm-gateway-v1'
primary_region = 'gru'

[build]

[deploy]
  release_command = 'node dist/tools/migrate.js'
  release_command_timeout = '5m'

[env]
  PORT = '3000'
  NODE_ENV = 'production'
  LOG_LEVEL = 'info'
  # Kill switch for SSE streaming: 'false' rejects stream:true with 400 at the
  # schema, before the circuit breaker and the upstream see the request.
  STREAMING_ENABLED = 'true'
  # Model of the circuit breaker's synthetic recovery probe. It must accept
  # max_tokens: an upstream refusal of the probe's own request closes the
  # breaker and raises upstream_probe_rejected.
  BREAKER_PROBE_MODEL = 'gpt-4o-mini'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # Edge backstop for process memory: floor(124.2 MiB available / 8.0 MiB per
  # in-flight request with a 1.5 MiB body) = 15. App-level gates reject first
  # (12 post-auth), and the edge only interferes at full peak. soft_limit sized
  # just under the post-auth gate so a future 2nd machine receives spillover
  # before any refusal.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 11
    hard_limit = 15

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    method = 'GET'
    path = '/health'
    timeout = '5s'
