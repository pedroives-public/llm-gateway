name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
          cache: "pnpm"

      # The production image and CI must run the same Node patch: the suite
      # pins runtime-specific fetch behavior, which only holds for production
      # if production runs the version the suite ran on. A base-image bump
      # that leaves node-version behind fails here instead of shipping.
      - name: Node matches the production image
        run: |
          image=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)-alpine.*/\1/p' Dockerfile)
          if [ "v$image" != "$(node -v)" ]; then
            echo "FAIL: the Dockerfile pins node '$image' but CI runs '$(node -v)'; the production image and CI must run the same Node patch"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # The deploy token is an environment secret, not a repository secret:
    # only a job that declares the environment receives it, and the
    # environment requires a human reviewer before the job starts. A workflow
    # edit pushed alongside the code cannot read the token unreviewed.
    environment:
      name: production
      url: https://llm-gateway-v1.fly.dev
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_NAME: llm-gateway-v1
      APP_URL: https://llm-gateway-v1.fly.dev
      # Bytes taken from the end of a response body when a failed smoke prints
      # it. A body is bytes this job does not control, and anyone who can see
      # the run can read its log. The cut is in bytes because a line count
      # bounds nothing when the body is one long line: 2000 holds the
      # gateway's longest stream-closing line (177 bytes) and the frames
      # before it. The printed bytes also must not start a workflow command.
      # The runner reads as a command a line that begins with `::` after
      # leading spaces, and `##[` anywhere in a line, so control bytes are
      # replaced, `##[` is broken and every printed line gets a prefix. With
      # the prefixes the printed text can reach three times the bytes taken.
      BODY_TAIL_BYTES: 2000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Deploy
        run: flyctl deploy --remote-only

      # Post-deploy proof of boot. With auto-stop machines, a successful
      # `flyctl deploy` does not prove the app boots: a stopped machine can
      # mask a crash loop. Proof = live requests answered by the machines this
      # deploy just placed in service. Log reads are not used as gates: log
      # history is uncorrelated with this release, and ingestion lag makes an
      # empty read meaningless.
      - name: "Smoke: /health answers 200"
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$APP_URL/health" || true)
            if [ "$code" = "200" ]; then exit 0; fi
            echo "attempt $attempt: got '$code'; retrying in 5s"
            sleep 5
          done
          echo "FAIL: /health never answered 200"
          exit 1

      # A well-formed key nobody owns exercises the full auth path (prefix and
      # length gates, then HMAC + database lookup). 32 random bytes, base64url:
      # the exact key shape the gateway expects. Asserting status AND exact
      # body proves the rejection came from the gateway's auth lane.
      - name: "Smoke: well-formed unknown key is rejected with 401"
        run: |
          key="lkey_$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=')"
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 \
            -X POST "$APP_URL/v1/chat/completions" \
            -H "authorization: Bearer $key" \
            -H "content-type: application/json" \
            -d '{"model":"smoke","messages":[{"role":"user","content":"smoke"}]}')
          if [ "$code" != "401" ] || [ "$(cat "$body")" != '{"error":"Unauthorized"}' ]; then
            echo "FAIL: expected 401 with the auth envelope, got '$code' with body:"
            tail -c "$BODY_TAIL_BYTES" "$body" | LC_ALL=C tr -c '[:print:]\n' '?' | sed -e 's/##\[/##_[/g' -e 's/^/| /'
            exit 1
          fi

      # Neither smoke above crosses the post-auth admission gate (/health is
      # outside both gates; the 401 dies at the pre-auth one), so a wedged
      # gate passed both on 2026-08-29. This is the smallest paid request the
      # schema allows, from a dedicated smoke tenant whose key lives next to
      # the deploy token. 200 proves auth, both gates and the upstream path;
      # anything else fails the deploy.
      - name: "Smoke: authenticated request crosses the post-auth gate"
        env:
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
        run: |
          if [ -z "$SMOKE_API_KEY" ]; then
            echo "FAIL: SMOKE_API_KEY is not set on the production environment"
            exit 1
          fi
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 60 \
            -X POST "$APP_URL/v1/chat/completions" \
            -H "authorization: Bearer $SMOKE_API_KEY" \
            -H "content-type: application/json" \
            -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"smoke"}],"max_tokens":1,"stream":false}')
          if [ "$code" != "200" ]; then
            echo "FAIL: expected 200 from an authenticated request, got '$code' with body:"
            tail -c "$BODY_TAIL_BYTES" "$body" | LC_ALL=C tr -c '[:print:]\n' '?' | sed -e 's/##\[/##_[/g' -e 's/^/| /'
            exit 1
          fi

      # The request above takes the buffered path. A release can break the
      # streaming relay while the buffered path still answers, and the status
      # would not show it: the gateway writes the response head after the
      # first frame, so 200 with the SSE content type proves nothing past that
      # frame. The last data line shows that the relay reached the end: on a
      # clean end the gateway relays the provider's `[DONE]` frame, and a
      # stream the gateway had to end itself closes with an error line
      # instead. A line is read the way the gateway reads one (CR, LF or CRLF
      # line ends, one optional space after `data:`). The gateway judges a
      # whole frame and this step only its last data line, and the frames in
      # between are not inspected.
      #
      # STREAMING_ENABLED in fly.toml is the kill switch, and this step takes
      # its expectation from the file being deployed. With streaming off, or
      # with the variable absent, which the gateway reads as off, the same
      # request must be refused with 400 `stream_not_supported`. The deploy
      # that turns streaming off then ends green, with the refusal seen on
      # the machine that answered. The value is taken by a line match, not by
      # a TOML parse, so the variable stays on a line of its own, in the form
      # `STREAMING_ENABLED = 'true'`.
      - name: "Smoke: streamed request ends with [DONE], or is refused with streaming off"
        env:
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
        run: |
          if [ -z "$SMOKE_API_KEY" ]; then
            echo "FAIL: SMOKE_API_KEY is not set on the production environment"
            exit 1
          fi
          clean() {
            LC_ALL=C tr -c '[:print:]\n' '?' | sed -e 's/##\[/##_[/g'
          }
          fail() {
            echo "FAIL: $1"
            tail -c "$BODY_TAIL_BYTES" "$body" | clean | sed -e 's/^/| /'
            exit 1
          }
          flag=$(sed -n "s/^[[:space:]]*STREAMING_ENABLED[[:space:]]*=[[:space:]]*//p" fly.toml | tr -d '[:space:]')
          case "$flag" in
            "'true'" | '"true"') streaming=on ;;
            "'false'" | '"false"' | "") streaming=off ;;
            *)
              echo "FAIL: fly.toml must set STREAMING_ENABLED to 'true' or 'false', or leave it out"
              exit 1
              ;;
          esac
          body=$(mktemp)
          result=$(curl -sS -o "$body" -w '%{http_code} %{content_type}' --max-time 60 \
            -X POST "$APP_URL/v1/chat/completions" \
            -H "authorization: Bearer $SMOKE_API_KEY" \
            -H "content-type: application/json" \
            -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"smoke"}],"max_tokens":1,"stream":true}')
          read -r code content_type <<< "$result"
          if [ "$streaming" = "off" ]; then
            if [ "$code" != "400" ] || ! grep -qaF '"code":"stream_not_supported"' "$body"; then
              fail "fly.toml turns streaming off, so expected 400 stream_not_supported, got '$code' with body:"
            fi
            exit 0
          fi
          if [ "$code" != "200" ]; then
            fail "expected 200 from a streamed request, got '$code' with body:"
          fi
          media_type=$(printf '%s' "${content_type%%;*}" | tr 'A-Z' 'a-z' | tr -d '[:space:]')
          if [ "$media_type" != "text/event-stream" ]; then
            shown_type=$(printf '%s' "$content_type" | clean | cut -c1-100)
            fail "expected content type text/event-stream, got '$shown_type' with body:"
          fi
          last=$(sed 's/\r$//' "$body" | tr '\r' '\n' | grep -aE '^data(:|$)' | tail -n 1 | sed -E 's/^data:? ?//' || true)
          if [ "$last" != "[DONE]" ]; then
            fail "expected the last data line of the stream to be [DONE], got body:"
          fi
