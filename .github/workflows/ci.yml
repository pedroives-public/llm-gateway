name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # The deploy token is an environment secret, not a repository secret:
    # only a job that declares the environment receives it, and the
    # environment requires a human reviewer before the job starts. A workflow
    # edit pushed alongside the code cannot read the token unreviewed.
    environment:
      name: production
      url: https://llm-gateway-v1.fly.dev
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_NAME: llm-gateway-v1
      APP_URL: https://llm-gateway-v1.fly.dev

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Deploy
        run: flyctl deploy --remote-only

      # Post-deploy proof of boot. With auto-stop machines, a successful
      # `flyctl deploy` does not prove the app boots: a stopped machine can
      # mask a crash loop. Proof = live requests answered by the machines this
      # deploy just placed in service. Log reads are not used as gates: log
      # history is uncorrelated with this release, and ingestion lag makes an
      # empty read meaningless.
      - name: "Smoke: /health answers 200"
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$APP_URL/health" || true)
            if [ "$code" = "200" ]; then exit 0; fi
            echo "attempt $attempt: got '$code'; retrying in 5s"
            sleep 5
          done
          echo "FAIL: /health never answered 200"
          exit 1

      # A well-formed key nobody owns exercises the full auth path (prefix and
      # length gates, then HMAC + database lookup). 32 random bytes, base64url:
      # the exact key shape the gateway expects. Asserting status AND exact
      # body proves the rejection came from the gateway's auth lane.
      - name: "Smoke: well-formed unknown key is rejected with 401"
        run: |
          key="lkey_$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=')"
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 \
            -X POST "$APP_URL/v1/chat/completions" \
            -H "authorization: Bearer $key" \
            -H "content-type: application/json" \
            -d '{"model":"smoke","messages":[{"role":"user","content":"smoke"}]}')
          if [ "$code" != "401" ] || [ "$(cat "$body")" != '{"error":"Unauthorized"}' ]; then
            echo "FAIL: expected 401 with the auth envelope, got '$code' with body:"
            cat "$body"
            exit 1
          fi

      # Neither smoke above crosses the post-auth admission gate (/health is
      # outside both gates; the 401 dies at the pre-auth one), so a wedged
      # gate passed both on 2026-08-29. This is the smallest paid request the
      # schema allows, from a dedicated smoke tenant whose key lives next to
      # the deploy token. 200 proves auth, both gates and the upstream path;
      # anything else fails the deploy.
      - name: "Smoke: authenticated request crosses the post-auth gate"
        env:
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
        run: |
          if [ -z "$SMOKE_API_KEY" ]; then
            echo "FAIL: SMOKE_API_KEY is not set on the production environment"
            exit 1
          fi
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 60 \
            -X POST "$APP_URL/v1/chat/completions" \
            -H "authorization: Bearer $SMOKE_API_KEY" \
            -H "content-type: application/json" \
            -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"smoke"}],"max_tokens":1,"stream":false}')
          if [ "$code" != "200" ]; then
            echo "FAIL: expected 200 from an authenticated request, got '$code' with body:"
            cat "$body"
            exit 1
          fi
