name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_NAME: llm-gateway-v1
      APP_URL: https://llm-gateway-v1.fly.dev

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Deploy
        run: flyctl deploy --remote-only

      # Post-deploy proof of boot. With auto-stop machines, a successful
      # `flyctl deploy` does not prove the app boots: a stopped machine can
      # mask a crash loop. Proof = a real request that wakes the machine and
      # gets answered, plus the server's listen line in the logs.
      - name: "Smoke: /health answers 200"
        run: |
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$APP_URL/health" || true)
            if [ "$code" = "200" ]; then exit 0; fi
            echo "attempt $attempt: got '$code'; retrying in 5s"
            sleep 5
          done
          echo "FAIL: /health never answered 200"
          exit 1

      # A well-formed key nobody owns exercises the full auth path (prefix and
      # length gates, then HMAC + database lookup). 32 random bytes, base64url:
      # the exact key shape the gateway expects. Expected outcome is 401.
      - name: "Smoke: well-formed unknown key is rejected with 401"
        run: |
          key="lkey_$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=')"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -X POST "$APP_URL/v1/chat/completions" \
            -H "authorization: Bearer $key" \
            -H "content-type: application/json" \
            -d '{"model":"smoke","messages":[{"role":"user","content":"smoke"}]}')
          if [ "$code" != "401" ]; then
            echo "FAIL: expected 401, got '$code'"
            exit 1
          fi

      - name: "Smoke: listen line present in logs"
        run: |
          if ! flyctl logs -a "$APP_NAME" --no-tail | grep -F "Server listening at"; then
            echo "FAIL: no listen line in recent logs"
            exit 1
          fi
