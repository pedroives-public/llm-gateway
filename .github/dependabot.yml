# Weekly dependency updates. npm minor/patch arrive grouped in one PR;
# majors come alone. github-actions bumps the commit-SHA pins in ci.yml.
# docker tracks the base image in the Dockerfile.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Types must match the Node runtime, which is pinned to 22 (the
      # outbound fetch relies on dispatcher behavior verified on Node 22).
      # A runtime upgrade is a deliberate decision, never a routine bump.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The base image is pinned to the Node patch. A minor or patch bump from
  # here fails CI's runtime check until node-version in ci.yml moves with it:
  # the PR stays red until someone takes the upgrade on deliberately.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Same reason as @types/node above: the base image major is the Node
      # runtime version itself.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
